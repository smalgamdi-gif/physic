<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Learning Lab</title>
<meta name="description" content="Personal tutor for the General Physics course: lessons, quizzes, practice, exam simulator and progress tracking.">
<style>:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1b2333; --muted:#5d6779; --line:#e2e6ef;
  --brand:#2f5bd3; --brand-ink:#ffffff; --brand-soft:#e8eefc;
  --ok:#1a8a4a; --ok-soft:#e3f5ea; --bad:#c23a2b; --bad-soft:#fbe7e4; --warn:#a86a00; --warn-soft:#fff3d6;
  --src:#0f6e7a; --src-soft:#e0f3f5; --add:#7a4bc2; --add-soft:#efe7fb;
  --radius:12px; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
:root[data-theme="dark"]{
  --bg:#11151d; --panel:#1a202b; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2b3342;
  --brand:#7d9bff; --brand-ink:#0d1220; --brand-soft:#232e4a;
  --ok:#4cc985; --ok-soft:#173527; --bad:#ff7a6b; --bad-soft:#3a1e1b; --warn:#ffc65a; --warn-soft:#3a2f17;
  --src:#5fd0dc; --src-soft:#16323a; --add:#c3a2ff; --add-soft:#2a2240;
  --shadow:none;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --panel:#1a202b; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2b3342;
  --brand:#7d9bff; --brand-ink:#0d1220; --brand-soft:#232e4a;
  --ok:#4cc985; --ok-soft:#173527; --bad:#ff7a6b; --bad-soft:#3a1e1b; --warn:#ffc65a; --warn-soft:#3a2f17;
  --src:#5fd0dc; --src-soft:#16323a; --add:#c3a2ff; --add-soft:#2a2240;
  --shadow:none;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Tahoma,Arial,sans-serif}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .atom{width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:16px}
.top .grow{flex:1}
.top .tog{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;color:var(--ink);font-size:13.5px}
.top .tog.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 54px)}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav.side a{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px}
nav.side a small{color:var(--muted);font-size:12px}
nav.side a:hover{background:var(--bg)}
nav.side a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav.side .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 12px 4px}
main{padding:24px 28px 80px;max-width:1040px;width:100%}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:16.5px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{font-size:28px;font-weight:700}
.stat small{font-size:13px;color:var(--muted);font-weight:500;display:block}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:9px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.src{background:var(--src-soft);color:var(--src)}
.pill.add{background:var(--add-soft);color:var(--add)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ar{direction:rtl;text-align:right;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);border-right:3px solid var(--src);padding:6px 12px;border-radius:8px;margin:6px 0;color:var(--ink);font-size:15px}
body.hide-ar .ar{display:none}
.step{display:flex;gap:12px;margin:14px 0 4px}
.step .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px}
.step h3{margin:3px 0 0}
.stepbody{margin-left:42px}
.formula{font-family:"Cambria Math","Cambria","Times New Roman",serif;font-size:19px;background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:8px 14px;margin:8px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:7px 8px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
td.arcell,th.arcell{direction:rtl;text-align:right}
body.hide-ar td.arcell, body.hide-ar th.arcell{display:none}
ul.clean{padding-left:20px;margin:6px 0}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.q .qt{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;text-align:left;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;width:190px}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14.5px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .sol{color:var(--ink);margin-top:4px}
.hint{color:var(--warn);font-size:14px;margin-top:6px}
.bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.chap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lessonlink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink);border:1px solid var(--line);margin:6px 0;background:var(--panel)}
.lessonlink:hover{border-color:var(--brand)}
.note{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14.5px}
.addbox{border-left:3px solid var(--add);background:var(--add-soft);padding:8px 12px;border-radius:8px;margin:8px 0}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:20px;cursor:pointer;user-select:none}
.flash .back{font-size:17px}
.kbd{font-family:Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
.muted{color:var(--muted)}
.right{float:right}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.search{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;width:220px;color:var(--ink)}
.results a{display:block;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results a:hover{background:var(--bg)}
.menu-btn{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:54px;width:260px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  .menu-btn{display:inline-block}
  main{padding:18px 16px 80px}
  .top{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .logo{font-size:15px}
  .logo .muted{display:none}
  .top .grow{display:none}
  .srchwrap{order:10;flex-basis:100%}
  .srchwrap .search{width:100%}
  #results{left:0;right:auto;width:100%!important}
  .top .tog{padding:4px 9px;font-size:12.5px}
  nav.side{top:96px;height:calc(100vh - 96px)}
  .formula{font-size:16px}
  table{display:block;overflow-x:auto}
  .stepbody{margin-left:0}
}
@media print{
  .top,nav.side,.noprint{display:none!important}
  .layout{display:block} main{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid}
}
.words{margin:6px 0 10px}
.words .en{font-size:14.5px;padding:4px 12px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px}
.flash .words{text-align:left;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.pill.ext{background:#e6f4ea;color:#1e6b3a}
:root[data-theme="dark"] .pill.ext{background:#173527;color:#7fdca3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ext{background:#173527;color:#7fdca3}}
/* fractions: {{a // b}} drawn as a over b */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .12em}
.frac>.nu{border-bottom:1.5px solid currentColor;padding:0 .25em .1em}
.frac>.de{padding:.1em .25em 0}
.qt .frac,.sol .frac,li .frac,p .frac,td .frac,.fdesc .frac,.opt .frac{font-size:.92em}
.formula.big{font-size:22px;padding:12px 16px}
/* every form of a law */
.forms{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.forms .fh{font-weight:700;margin-bottom:2px}
.form{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.form:last-child{border-bottom:0;padding-bottom:0}
.form .find{flex:none;min-width:52px;padding:4px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;font-weight:800;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-size:18px;line-height:1.2}
.form .find small{font:600 10.5px "Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.form .fbody{flex:1;min-width:0}
.form .formula{margin:0 0 6px;font-size:19px}
.fdesc{font-size:14.5px;margin:2px 0}
.how{margin-top:6px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 0}
.chain .arr{color:var(--brand);font-family:"Segoe UI",sans-serif}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-family:"Cambria Math","Cambria","Times New Roman",serif;font-size:15px;background:var(--bg)}
.fchip b{color:var(--brand)}
@media (max-width:860px){.formula.big{font-size:18px}.form .formula{font-size:16px}.chain{font-size:15px}.form{gap:8px}.form .find{min-width:44px;font-size:16px}}
@media print{.form{break-inside:avoid}}
.ar bdi[dir=ltr]{unicode-bidi:isolate}
.en-help{margin:2px 0 12px;font-size:14.5px;color:var(--muted)}
.ready .lessonlink{margin:6px 0}
/* side menu: ☰ collapses it on wide screens too; groups fold open and closed */
.menu-btn{display:inline-block}
@media (min-width:861px){body.side-closed .layout{grid-template-columns:1fr} body.side-closed nav.side{display:none}}
nav.side button.grp{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 12px);background:none;border:0;border-radius:8px;padding:6px 6px;margin:12px 6px 4px;cursor:pointer;font:inherit;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left}
nav.side button.grp:hover{background:var(--bg);color:var(--ink)}
nav.side .caret{font-size:13px}
nav.side .grpbody.closed{display:none}
/* exam: full-screen window with countdown */
body.exam-open{overflow:hidden}
.exam-ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.extitle{font-weight:700;display:flex;flex-direction:column;line-height:1.3}
.extitle small{font-weight:400;font-size:12.5px}
.extimer{font:700 30px/1 Consolas,"Courier New",monospace;letter-spacing:.04em;padding:6px 14px;border-radius:10px;background:var(--brand-soft);color:var(--brand);min-width:120px;text-align:center}
.extimer.low{background:var(--warn-soft);color:var(--warn)}
.extimer.last{background:var(--bad-soft);color:var(--bad);animation:expulse 1s infinite}
@keyframes expulse{50%{opacity:.55}}
.exact{display:flex;align-items:center;gap:8px}
.exact .tog{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;color:var(--ink)}
.extime{height:5px;background:var(--line)}
.extime i{display:block;height:100%;background:var(--brand);transition:width .25s linear}
.exbody{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0}
.expal{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px}
.expal button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer}
.expal button.ans{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.expal button.flag{box-shadow:inset 0 0 0 3px var(--warn)}
.expal button.cur{outline:3px solid var(--ink);outline-offset:1px}
.exkey{flex-basis:100%;display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.exkey .k{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--bg);margin-right:6px;vertical-align:-1px}
.exkey .k.ans{background:var(--brand);border-color:var(--brand)}
.exkey .k.flag{box-shadow:inset 0 0 0 3px var(--warn)}
.exmain{overflow:auto;padding:22px 28px 60px;max-width:900px;width:100%;margin:0 auto}
.exmain .q{font-size:17px}
.eflag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;color:var(--muted);font-size:13px;cursor:pointer}
.eflag.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.exnav{justify-content:space-between;margin-top:16px}
.exconf{border-color:var(--brand)}
@media (max-width:860px){.exbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}.expal{border-right:0;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;padding:8px 10px}.expal button{flex:none;width:36px;height:36px}.exkey{display:none}.exmain{padding:14px 14px 60px}.extimer{font-size:22px;min-width:90px}.exhead{padding:8px 10px}.extitle small{display:none}}
/* inside a Claude link printing and file downloads are blocked, so those buttons are hidden there */
.framed .printbtn{display:none!important}
.inconf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px}
.copybox{width:100%;min-height:120px;margin-top:8px;font:12px Consolas,monospace;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px}
/* side menu rows: English left, Arabic right, one line each; only chapter names may wrap */
.layout{grid-template-columns:270px 1fr}
nav.side a.nl{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:7px 10px;font-size:14px;line-height:1.35}
nav.side a.nl>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side a.nl>small{white-space:nowrap;direction:rtl;text-align:right;font-size:12.5px}
nav.side a.chl>span{white-space:normal}
nav.side a.chl>small{font-variant-numeric:tabular-nums;direction:ltr}
@media (max-width:860px){.layout{grid-template-columns:1fr} nav.side{width:min(290px,86vw)}}
/* the content column follows the space it really has (side menu open or closed):
   centred, a little wider with the menu closed, and card rows reflow by the column's own width */
main{container-type:inline-size;margin-inline:auto}
body.side-closed main{max-width:1180px}
@container (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:620px){.g3{grid-template-columns:1fr}}
@container (max-width:560px){.g2,.g4{grid-template-columns:1fr}}
.grid>.card{margin:0}
.grid{margin:12px 0}
/* lesson steps: every step body is one panel; blocks inside it are separated by thin rules, not nested cards */
.stepbody{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;min-width:0}
.stepbody>:first-child{margin-top:0}
.stepbody>:last-child{margin-bottom:0}
.stepbody .card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 0;margin:0!important}
.stepbody>.card:first-child{border-top:0;padding-top:4px}
.stepbody>.addbox:only-child{margin:0}
@media (max-width:860px){.stepbody{padding:12px 14px}}
@media print{.stepbody{box-shadow:none}}
/* side menu group headers: a distinct, clickable band per section; open groups are tinted and their items hang off a rule */
nav.side button.grp{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;column-gap:8px;width:100%;margin:16px 0 6px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;text-transform:none;letter-spacing:0;transition:background .15s,border-color .15s}
nav.side button.grp:hover{border-color:var(--brand)}
nav.side button.grp:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
nav.side button.grp[aria-expanded="true"]{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
nav.side .grp .gi{font-size:16px;line-height:1}
nav.side .grp .gt{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.side .grp .ga{direction:rtl;font-size:12.5px;font-weight:600;opacity:.85;white-space:nowrap}
nav.side .grp .gn{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--panel);color:var(--muted);font-variant-numeric:tabular-nums}
nav.side .grp .caret{display:grid;place-items:center;width:16px;height:16px;color:var(--muted);transition:transform .15s}
nav.side .grp[aria-expanded="true"] .caret{transform:rotate(90deg);color:var(--brand)}
nav.side .grpbody{margin:0 0 4px 14px;padding-left:6px;border-left:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){nav.side button.grp,nav.side .grp .caret{transition:none}}
/* the lab button: its own teal colour so it stands apart from the blue study controls */
:root{--lab:#0f6e7a;--lab-ink:#ffffff;--lab-hover:#0b5862}
:root[data-theme="dark"]{--lab:#3fb8c6;--lab-ink:#071a1d;--lab-hover:#6fd3de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lab:#3fb8c6;--lab-ink:#071a1d;--lab-hover:#6fd3de}}
.labbtn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:var(--lab);color:var(--lab-ink);text-decoration:none;font-weight:700;font-size:14px;line-height:1.2;box-shadow:0 2px 8px rgba(15,110,122,.28);white-space:nowrap;transition:background .15s,transform .15s}
.labbtn:hover{background:var(--lab-hover);transform:translateY(-1px)}

<script>/* Arabic reads right to left. Inside an Arabic sentence each run of Latin text, numbers or formulas is wrapped in
   <bdi dir="ltr"> so it stays one left‑to‑right unit: "R = V/I" or a drawn fraction is never reordered by the bidi
   algorithm. Runs on every .ar / .arcell element as soon as it appears on the page. */
(function () {
  const A = '؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿';
  const HAS_AR = new RegExp('[' + A + ']');
  const TOK = new RegExp('([' + A + ']+)|(\\s+)|([^\\s' + A + ']+)', 'g');
  const SEL = '.ar, .arcell';
  function fix(el) {
    if (el.dataset.rtl) return; el.dataset.rtl = '1';
    const atoms = [];
    [...el.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        let m; TOK.lastIndex = 0;
        while ((m = TOK.exec(n.data))) {
          if (m[1]) atoms.push({ t: 'A', s: m[0] });
          else if (m[2]) atoms.push({ t: 'S', s: m[0] });
          else { const p = m[0].match(/^([«»"“”]*)(.*?)([.,;:!?،؛«»"“”]*)$/); if (p[1]) atoms.push({ t: 'P', s: p[1] }); if (p[2]) atoms.push({ t: 'L', s: p[2] }); if (p[3]) atoms.push({ t: 'P', s: p[3] }); }
        }
      } else if (n.nodeType === 1 && n.tagName !== 'BR' && !HAS_AR.test(n.textContent)) atoms.push({ t: 'L', n });
      else { if (n.nodeType === 1 && n.tagName !== 'BR') fix(n); atoms.push({ t: 'A', n }); }
    });
    if (!atoms.some(a => a.t === 'L')) return;
    const out = document.createDocumentFragment(), node = a => a.n || document.createTextNode(a.s);
    let run = null, gap = [];
    // a bracket belongs to the formula only if its partner is inside it too: "(ليس …)" keeps its brackets in the Arabic text
    const balance = () => {
      const txt = () => run.map(a => a.s || '').join(''), cnt = c => txt().split(c).length - 1;
      while (run.length && run[0].s && run[0].s[0] === '(' && cnt('(') > cnt(')')) { out.appendChild(document.createTextNode('(')); run[0] = { t: 'L', s: run[0].s.slice(1) }; if (!run[0].s) run.shift(); }
      let tail = '';
      while (run.length && run[run.length - 1].s && /\)$/.test(run[run.length - 1].s) && cnt(')') > cnt('(')) { const l = run[run.length - 1]; tail = ')' + tail; run[run.length - 1] = { t: 'L', s: l.s.slice(0, -1) }; if (!run[run.length - 1].s) run.pop(); }
      return tail;
    };
    // an operator next to an Arabic word belongs to the Arabic sentence: "الإجهاد = F/A" keeps "=" between the word and the formula
    const OPS = /^[=+−×÷≈∝→⟹<>≤≥·-]+$/;
    const trimOps = () => {
      let tail = '';
      while (run.length && run[0].s && OPS.test(run[0].s)) { out.appendChild(document.createTextNode(run.shift().s)); while (run.length && run[0].t === 'S') out.appendChild(document.createTextNode(run.shift().s)); }
      while (run.length && run[run.length - 1].s && OPS.test(run[run.length - 1].s)) { tail = run.pop().s + tail; while (run.length && run[run.length - 1].t === 'S') tail = run.pop().s + tail; }
      return tail;
    };
    const close = () => { let tail = ''; if (run) { tail = balance(); const t2 = run.length ? trimOps() : ''; tail = t2 + tail; } if (run && !run.length) run = null; if (run) { const b = document.createElement('bdi'); b.dir = 'ltr'; run.forEach(a => b.appendChild(node(a))); out.appendChild(b); run = null; } if (tail) out.appendChild(document.createTextNode(tail)); gap.forEach(a => out.appendChild(node(a))); gap = []; };
    atoms.forEach(a => {
      if (a.t === 'L') { if (run) { gap.forEach(g => run.push(g)); gap = []; run.push(a); } else { gap.forEach(g => out.appendChild(node(g))); gap = []; run = [a]; } }
      else if (a.t === 'S') { if (run) gap.push(a); else out.appendChild(node(a)); }
      else { close(); out.appendChild(node(a)); }
    });
    close();
    el.textContent = ''; el.appendChild(out);
  }
  const scan = root => { if (root.matches && root.matches(SEL)) fix(root); if (root.querySelectorAll) root.querySelectorAll(SEL).forEach(fix); };
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) scan(n); }))).observe(document.body, { childList: true, subtree: true });
  scan(document.body);
  window.__RTL = { fix, scan };
})();

  (function deepMath(o) { for (const k in o) { const v = o[k]; if (typeof v === 'string') { if (v.includes('{{')) o[k] = mathify(v); } else if (v && typeof v === 'object') deepMath(v); } })([window.COURSE, window.FORMS || {}]);

  // ---------- mastery & recommendation ----------

    <p class="sub">The maths and reading skills the course uses without teaching them. ${ADD}</p>
    <div class="ar">مقرر الفيزياء يفترض أنك تعرف هذه المهارات (سجل الفجوات G‑03). كل مهارة فيها شرح عربي مبسط، ومثال محلول، وتمارين بأرقام جديدة كل مرة، وروابط للدروس التي تستخدمها.</div>
    <div class="card row" style="justify-content:space-between"><span>${S.placement ? `Placement test taken on ${new Date(S.placement.ts).toLocaleDateString()}: <b>${S.placement.pct}%</b>` : 'Not sure where to start? Take the placement test first.'}</span><a class="btn ${S.placement ? 'ghost' : ''}" href="#placement">${S.placement ? 'Retake placement test' : 'Placement test'}</a></div>
    <div class="grid g2">${SKILLS().map((k, i) => `<a class="card" style="text-decoration:none;color:inherit" href="#skill/${k.id}"><div class="chap"><div><b>0.${i + 1} ${esc(k.title)}</b><div class="muted" style="font-size:13px"><bdi>${k.ar}</bdi></div></div>${skillPill(k.id)}</div>${bar(skillScore(k.id))}<div class="muted" style="font-size:12.5px;margin-top:6px">Used in: ${k.uses.map(u => u[0] === 'lab' ? 'lab' : 'Ch ' + lessonById(u[0]).ch.n).filter((x, j, a) => a.indexOf(x) === j).join(', ')}</div></a>`).join('')}</div>`;
  views.skill = id => {
    const k = skillById(id); if (!k) return views.found();
    const i = SKILLS().indexOf(k), nx = SKILLS()[i + 1];
    return `<div class="row muted" style="font-size:13px"><a href="#found">Unit 0: Foundations</a> › skill</div>
      <h1>0.${i + 1} ${esc(k.title)}</h1><p class="sub"><bdi>${k.ar}</bdi> · ${ADD} ${skillPill(id)}</p>
      <div class="card"><h3 style="margin-top:0">📖 Explanation · الشرح</h3>${k.explain.map(e => `<div class="ar">${e[0]}</div><p class="en-help">${e[1]}</p>`).join('')}
      ${k.link ? `<a class="btn small ghost" href="${k.link}">Full guide: rearranging laws</a>` : ''}</div>
      <div class="card"><h3 style="margin-top:0">✏️ Worked example · مثال محلول</h3><p><b>${k.example.q}</b></p><ol class="clean">${k.example.steps.map(x => `<li>${x}</li>`).join('')}</ol><p><b>Answer:</b> ${k.example.ans}</p></div>
      <div class="card"><h3 style="margin-top:0">🎯 Practice: 5 fresh questions · تدريب</h3><div class="ar">أجب عن الأسئلة كلها ثم اضغط «تحقق». 4 من 5 تعني أنك أتقنت المهارة.</div><div id="skq"></div><div id="skres"></div></div>
      <div class="card"><h3 style="margin-top:0">📍 Where the course uses it · أين تحتاجها في المقرر</h3>${usesLinks(k)}</div>
      <div class="row noprint" style="justify-content:space-between;margin-top:18px"><a class="btn ghost" href="#found">← Unit 0</a>${nx ? `<a class="btn ghost" href="#skill/${nx.id}">${esc(nx.title)} →</a>` : `<a class="btn ghost" href="#lesson/ch1-l1">Start Chapter 1 →</a>`}</div>`;
  };
  function afterSkill(id) {
    const k = skillById(id); if (!k) return;
    const run = () => {
      const items = [0, 1, 2, 3, 4].map(() => k.gen()); const res = {};
      $('#skres').innerHTML = '';
      $('#skq').innerHTML = items.map((it, i) => `<div data-sk="${i}">${qHTML(it, 'sk' + i)}</div>`).join('');
      checkAllBtn($('#skq'), items.map((it, i) => wireQ(document.querySelector(`[data-sk="${i}"]`), it, (ok, given) => { res[i] = ok; if (!ok) logMistake(it, given, null); }, { deferred: true })), () => {
        const pct = Math.round(Object.values(res).filter(Boolean).length / items.length * 100);
        const st = S.found[id] = S.found[id] || {}; st.best = Math.max(st.best ?? 0, pct); st.last = pct; st.n = (st.n || 0) + 1; save();
        $('#skres').innerHTML = `<div class="card"><b>Score: ${pct}%</b> (best ${st.best}%) ${pct >= 80 ? '✔ Mastered.' : 'Read the explanation again and try a new set.'}<div class="ar">${pct >= 80 ? 'ممتاز، أتقنت هذه المهارة.' : 'أعد قراءة الشرح والمثال، ثم جرّب مجموعة جديدة.'}</div><button class="btn small ghost" id="sknew">New set of questions</button></div>`;
        $('#sknew').onclick = () => { document.querySelectorAll('.checkall').forEach(x => x.closest('.row').remove()); run(); };
      });
    };
    run();
  }
  views.placement = () => `<h1>Placement test <span class="muted" style="font-size:18px;font-weight:400">· اختبار تحديد المستوى</span></h1>
    <p class="sub">${SKILLS().length * 2} questions, two on each foundation skill. No timer, no feedback until the end. ${ADD}</p>
    <div class="ar">سؤالان على كل مهارة من مهارات الوحدة صفر. أجب بصدق ولا تستعجل، والنتيجة تحدد لك من أين تبدأ: المهارات التي تتقنها تتخطاها، والباقي تراجعه قبل فصوله.</div>
    <div id="plbox"><button class="btn" id="plgo">Start the placement test</button></div>`;
  function afterPlacement() {
    $('#plgo').onclick = () => {
      const qs = []; SKILLS().forEach(k => { qs.push({ k, it: k.gen() }); qs.push({ k, it: k.gen() }); });
      const ans = {};
      $('#plbox').innerHTML = qs.map((x, i) => `<div data-pl="${i}"><div class="muted" style="font-size:13px;margin-top:10px">Q${i + 1} · ${esc(x.k.title)}</div>${qHTML(x.it, 'pl' + i)}</div>`).join('') + '<div id="plres"></div>';
      const hs = qs.map((x, i) => wireQ(document.querySelector(`[data-pl="${i}"]`), x.it, (ok, given) => { ans[i] = { ok, given }; }, { deferred: true, silent: true, hideSol: true }));
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Finish and see my plan · أنهِ الاختبار'; b.style.marginTop = '12px'; $('#plres').before(b);
      b.onclick = () => {
        hs.forEach(h => h.check());
        const res = {}; qs.forEach((x, i) => { const r = res[x.k.id] = res[x.k.id] || [0, 0]; r[1]++; if (ans[i] && ans[i].ok) r[0]++; else logMistake(x.it, ans[i] ? ans[i].given : '(blank)', null); });
        const good = Object.values(res).reduce((a, r) => a + r[0], 0), pct = Math.round(good / qs.length * 100);
        S.placement = { ts: Date.now(), res, pct }; save(); b.remove();
        const weak = SKILLS().filter(k => res[k.id][0] < 2);
        $('#plbox').innerHTML = `<div class="card"><h2 style="margin-top:0">Result: ${pct}% (${good}/${qs.length})</h2><table><tr><th>Skill</th><th>Correct</th><th>Next step</th></tr>${SKILLS().map(k => { const r = res[k.id]; return `<tr><td><a href="#skill/${k.id}">${esc(k.title)}</a><br><small class="muted">${k.ar}</small></td><td><b>${r[0]}/${r[1]}</b></td><td>${r[0] === 2 ? '<span class="pill ok">skip it</span>' : r[0] === 1 ? '<span class="pill warn">quick review</span>' : '<span class="pill bad">study it</span>'}</td></tr>`; }).join('')}</table>
          ${weak.length ? `<p><b>Your plan:</b> study ${weak.map(k => `<a href="#skill/${k.id}">${esc(k.title)}</a>`).join(', ')}, then start Chapter 1. Each chapter page also shows which of these it needs.</p><div class="ar">خطتك: راجع المهارات المعلَّمة أعلاه بالترتيب، ثم ابدأ الفصل الأول. وصفحة كل فصل تذكّرك بالمهارات التي يحتاجها.</div><a class="btn" href="#skill/${weak[0].id}">Start with: ${esc(weak[0].title)}</a>` : `<p><b>Your foundations are solid.</b> Start Chapter 1.</p><div class="ar">أساسك قوي، ابدأ الفصل الأول مباشرة.</div><a class="btn" href="#lesson/ch1-l1">Start Chapter 1</a>`}
          <p class="muted" style="font-size:13px">Wrong answers were added to your mistake journal.</p></div>`;
        window.scrollTo(0, 0);
      };
    };
  }
  // ---------- glossary & problem language ----------
  views.glossary = () => `<h1>Course glossary <span class="muted" style="font-size:18px;font-weight:400">· قاموس المقرر</span></h1>
    <p class="sub">Every English term from the lessons with its Arabic and meaning. <span class="pill src">📘 terms from the lessons</span></p>
    <div class="ar">كل المصطلحات الإنجليزية في الدروس مع معناها بالعربي. ابحث بالعربي أو بالإنجليزي.</div>
    <div class="card row noprint"><input id="gq" class="search" style="width:260px" placeholder="Search · ابحث"><select id="gch"><option value="">All chapters</option>${COURSE.map(c => `<option value="${c.id}">Ch ${c.n}. ${esc(c.title)}</option>`).join('')}</select><span class="muted" id="gn"></span></div>
    <div class="card"><table id="gtab"><tr><th>Term</th><th class="arcell">بالعربية</th><th>Meaning</th><th>Lesson</th></tr>${allLessons().flatMap(l => l.terms.map(t => `<tr data-ch="${l.ch.id}" data-h="${esc((t.join(' ')).toLowerCase())}"><td><b>${t[0]}</b></td><td class="arcell">${t[1]}</td><td>${t[2]}</td><td><a href="#lesson/${l.id}">${l.ch.n}. ${esc(l.title)}</a></td></tr>`)).join('')}</table></div>`;
  function afterGlossary() {
    const f = () => { const q = $('#gq').value.trim().toLowerCase(), ch = $('#gch').value; let n = 0; document.querySelectorAll('#gtab tr[data-h]').forEach(r => { const ok = (!ch || r.dataset.ch === ch) && (!q || r.dataset.h.includes(q)); r.style.display = ok ? '' : 'none'; if (ok) n++; }); $('#gn').textContent = `${n} terms`; };
    $('#gq').oninput = f; $('#gch').onchange = f; f();
  }
  views.phrases = () => `<h1>Problem language <span class="muted" style="font-size:18px;font-weight:400">· لغة المسائل</span></h1>
    <p class="sub">Words in an English problem that hide a number or tell you what to do. ${ADD}</p>
    <div class="ar">كثير من الأخطاء سببها فهم السؤال لا الفيزياء. هذه الكلمات تتكرر في أسئلة المقرر، وبعضها يعطيك رقمًا دون أن يكتبه، مثل from rest التي تعني أن السرعة الابتدائية صفر.</div>
    ${PHRASES.map(g => `<div class="card"><h3 style="margin-top:0">${g.sec}</h3><table><tr><th>In the problem</th><th class="arcell">بالعربية</th><th>What it tells you</th></tr>${g.rows.map(r => `<tr><td><b>${r[0]}</b></td><td class="arcell">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`).join('')}
    <div class="card"><h3 style="margin-top:0">Drill · تدريب</h3><div id="phbox"></div></div>`;
  function afterPhrases() {
    const rows = PHRASES.flatMap(g => g.rows); let score = 0, total = 0;
    const next = () => {
      const r = pick(rows), o = shuffle([r[2], ...shuffle(rows.filter(x => x[2] !== r[2])).slice(0, 3).map(x => x[2])]);
      const item = { q: `In a problem you read “<b>${r[0]}</b>”. What does it tell you?`, o, a: o.indexOf(r[2]), why: `${r[0]} = ${r[1]} → ${r[2]}` };
      $('#phbox').innerHTML = qHTML(item, 'ph') + `<div class="row" style="margin-top:8px"><button class="btn small" id="phnext">Next</button><span class="muted" id="phs">${score}/${total}</span></div>`;
      wireQ($('#phbox'), item, ok => { total++; if (ok) score++; $('#phs').textContent = `${score}/${total}`; });
      $('#phnext').onclick = next;
    };
    next();
  }

  const FNAV = [['placement', '🧭 Placement', 'تحديد المستوى'], ['found', '🧱 Unit 0', 'الوحدة صفر'], ['glossary', '🔤 Glossary', 'قاموس المقرر'], ['phrases', '🗝️ Problem words', 'لغة المسائل']];
  views.course = () => `<h1>Course map</h1><p class="sub">General Physics · 10 chapters as ordered in your textbook. <span class="pill src">📘 BK chapter openers</span></p>` + COURSE.map(c => { const cm = chapterMastery(c); return `<div class="card"><div class="chap"><a href="#chapter/${c.id}"><b>Ch ${c.n}. ${esc(c.title)}</b></a><span class="muted"><bdi>${c.ar}</bdi> · ${c.src}</span></div>${arLine(ARC(c.id))}${bar(cm.avg)}${c.lessons.map((l, i) => { const m = mastery(l.id); const [lv, cls] = level(m); return `<a class="lessonlink" href="#lesson/${l.id}"><span>${c.n}.${i + 1} ${esc(l.title)} <small class="muted"><bdi>· ${l.ar}</bdi></small>${ARL(l.id) ? `<small class="ar arsub">${ARL(l.id).d}</small>` : ''}</span><span class="${cls}">${lv}${m != null ? ' ' + m + '%' : ''}</span></a>`; }).join('')}</div>`; }).join('');

  function sidebar(active) {
    const chs = COURSE.map(c => { const cm = chapterMastery(c); return `<a href="#chapter/${c.id}" class="nl chl ${active === 'chapter/' + c.id ? 'active' : ''}"><span>${c.n}. ${esc(c.title)}</span><small>${cm.avg}%</small></a>`; }).join('');
    const on = n => active.split('/')[0] === n[0] || (n[0] === 'found' && active.startsWith('skill'));
    const link = n => `<a href="#${n[0]}" class="nl ${on(n) ? 'active' : ''}" title="${n[1].replace(/^\S+\s/, '')} · ${n[2]}"><span>${n[1]}</span><small>${n[2]}</small></a>`;
    // collapsible groups; the group holding the open page always stays open
    const g = S.prefs.groups || {};
    const group = (id, icon, en, ar, n, html, has) => { const open = has || g[id] !== false; return `<button class="grp" data-g="${id}" aria-expanded="${open}"><span class="gi" aria-hidden="true">${icon}</span><span class="gt">${en}</span><span class="ga">${ar}</span><span class="caret" aria-hidden="true"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M3.5 1.5 7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><div class="grpbody${open ? '' : ' closed'}">${html}</div>`; };
    return link(NAV[0]) + group('tools', '🧰', 'Study tools', 'أدوات المذاكرة', NAV.length - 1, NAV.slice(1).map(link).join(''), NAV.slice(1).some(on))
      + group('found', '🧱', 'Foundation', 'التأسيس', FNAV.length, FNAV.map(link).join(''), FNAV.some(on))
      + group('chapters', '📚', 'Chapters', 'الفصول', COURSE.length, chs, active.startsWith('chapter/') || active.startsWith('lesson/'))
      + `<a class="sidelab" href="Virtual_Lab.html"><span>⚗ Virtual Lab</span><small dir="rtl">المعمل الافتراضي · 11 تجربة</small></a>`;
  }
  function route() {
    const h = (location.hash || '#home').slice(1); const [v, arg] = h.split('/');
    const view = views[v] || views.home;
    $('#main').innerHTML = fx(view(arg));
    $('#side').innerHTML = sidebar(h); $('#side').classList.remove('open');
    if (v === 'lesson') afterLesson(arg);
    if (v === 'practice') afterPractice(arg);
    if (v === 'exam') afterExam();
    if (v === 'flashcards') afterFlash(arg);
    if (v === 'mistakes') afterMistakes();
    if (v === 'tools') afterTools();
    if (v === 'rearrange') afterRearrange();
    if (v === 'chapter') afterChapter(arg);
    if (v === 'skill') afterSkill(arg);
    if (v === 'placement') afterPlacement();
    if (v === 'glossary') afterGlossary();
    if (v === 'phrases') afterPhrases();
    if (v === 'plan') afterPlan();
    if (v === 'report') afterReport();
    window.scrollTo(0, 0);
  }

  const effTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function applyPrefs() {
    document.body.classList.toggle('hide-ar', !S.prefs.ar);
    // no saved choice: follow the device (or the viewer's) setting
    if (S.prefs.theme) document.documentElement.dataset.theme = S.prefs.theme;
    $('#tar').classList.toggle('on', S.prefs.ar); $('#tth').textContent = effTheme() === 'dark' ? '☀️ Light' : '🌙 Dark';
  }
  document.addEventListener('DOMContentLoaded', () => {
    $('#tar').onclick = () => { S.prefs.ar = !S.prefs.ar; save(); applyPrefs(); };
    $('#tth').onclick = () => { S.prefs.theme = effTheme() === 'dark' ? 'light' : 'dark'; save(); applyPrefs(); };
    // ☰ hides or shows the side menu: a slide-in panel on phones, a collapsible column on wider screens (remembered)
    const wide = matchMedia('(min-width: 861px)');
    const applySide = () => { document.body.classList.toggle('side-closed', S.prefs.side === false); $('#menu').setAttribute('aria-expanded', String(wide.matches ? S.prefs.side !== false : $('#side').classList.contains('open'))); };
    $('#menu').onclick = () => { if (wide.matches) { S.prefs.side = S.prefs.side === false; save(); } else $('#side').classList.toggle('open'); applySide(); };
    $('#side').addEventListener('click', e => { const b = e.target.closest('.grp'); if (!b) return; const body = b.nextElementSibling, open = body.classList.toggle('closed') === false;
      b.setAttribute('aria-expanded', String(open)); S.prefs.groups = Object.assign({}, S.prefs.groups, { [b.dataset.g]: open }); save(); });
    applySide();
    const sr = $('#search'), res = $('#results');
    sr.oninput = () => { const r = search(sr.value); res.innerHTML = r.length ? `<div class="card results">${r.join('')}</div>` : ''; };
    res.onclick = () => { res.innerHTML = ''; sr.value = ''; };
    applyPrefs(); route();
  });
  window.addEventListener('hashchange', () => { if (EXAM) { history.replaceState(null, '', EXAM.hash); return; } route(); });
  window.addEventListener('beforeunload', e => { if (EXAM) { e.preventDefault(); e.returnValue = ''; } });
  window.__PLL = { mastery, parseNum, numOk, dimOf, G, allLessons };
})();
</script>
</body>
</html>
